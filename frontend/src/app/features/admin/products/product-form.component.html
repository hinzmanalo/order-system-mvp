<div class="form-container">
  <div class="form-header">
    <h2>{{ isEditMode() ? 'Edit Product' : 'Create Product' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Product Name *</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        [class.error]="hasError('name', 'required') || hasError('name', 'maxLength')"
        placeholder="Enter product name"
      />
      @if (getErrorMessage('name')) {
        <div class="error-message">{{ getErrorMessage('name') }}</div>
      }
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        rows="3"
        placeholder="Enter product description (optional)"
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="price">Price *</label>
        <input
          type="number"
          id="price"
          formControlName="price"
          class="form-control"
          [class.error]="hasError('price', 'required') || hasError('price', 'min')"
          placeholder="0.00"
          step="0.01"
          min="0"
        />
        @if (getErrorMessage('price')) {
          <div class="error-message">{{ getErrorMessage('price') }}</div>
        }
      </div>

      <div class="form-group">
        <label for="sku">SKU *</label>
        <input
          type="text"
          id="sku"
          formControlName="sku"
          class="form-control"
          [class.error]="hasError('sku', 'required') || hasError('sku', 'maxLength')"
          placeholder="Enter SKU"
        />
        @if (getErrorMessage('sku')) {
          <div class="error-message">{{ getErrorMessage('sku') }}</div>
        }
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="submitting()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Saving...' : (isEditMode() ? 'Update Product' : 'Create Product') }}
      </button>
    </div>
  </form>
</div>
